spring:
  application:
    name: hm-dianping
    #配置数据库连接信息
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmdpA?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${HMDP_DB_PASSWORD:123321}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${HMDP_REDIS_PASSWORD:123321}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      database: 1
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    virtual-host: /hmdp
    username: hmdp
    password: 123321
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 监听方法正常结束后由容器确认；抛异常则按失败处理。
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
server:
  port: 8091
# 配置ai模型
langchain4j:
  open-ai:
    chat-model:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      # 兼容 OpenAI 协议的 DeepSeek 配置；密钥只从环境变量读取，不写入仓库。
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:not-configured}}
      model-name: ${MODEL_NAME:deepseek-flash}
      timeout: 30s
      max-retries: 0
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:not-configured}}
      model-name: ${MODEL_NAME:deepseek-flash}
      timeout: 30s
      max-retries: 0
      log-requests: true
      log-responses: true
    embedding-model:
      # Java 通过 OpenAI 兼容协议调用本机 SentenceTransformer 服务。
      base-url: http://127.0.0.1:${AI_EMBEDDING_PORT:8088}/v1
      api-key: local-embedding
      model-name: bge-small-zh-v1.5
      log-requests: false
      log-responses: false
