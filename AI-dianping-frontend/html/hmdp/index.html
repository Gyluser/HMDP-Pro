<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <title>黑马点评</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="./css/element.css" />

    <link href="./css/index.css?v=20261024" rel="stylesheet" />
    <link href="./css/main.css" rel="stylesheet" />
    <link href="./css/glass.css" rel="stylesheet" />
    <link href="./css/ai-assistant.css?v=20261025" rel="stylesheet" />

    <style type="text/css">
      .el-input__inner {
        border-radius: 20px;
      }
    </style>
  </head>
  <body class="home-page">
    <div id="app" @scroll="onScroll">
      <div class="search-bar">
        <a
          class="ai-launcher-button home-ai-button"
          href="./aiassistant.html"
          title="打开AI顾问"
          aria-label="打开AI顾问"
        >
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient
                id="ai-icon-gradient-home"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#2f6f68"></stop>
                <stop offset="100%" stop-color="#6ca89a"></stop>
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="18" fill="rgba(255,255,255,0.22)"></circle>
            <path
              d="M17 18c0-3.314 2.686-6 6-6h2c3.314 0 6 2.686 6 6 0 1.824-.82 3.453-2.108 4.551-.26.221-.26.675 0 .896C29.18 24.545 30 26.175 30 28c0 3.314-2.686 6-6 6h-2c-3.314 0-6-2.686-6-6 0-1.825.82-3.455 2.108-4.553.26-.221.26-.675 0-.896C17.82 21.454 17 19.824 17 18Z"
              stroke="url(#ai-icon-gradient-home)"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            ></path>
            <circle cx="20" cy="18" r="1.8" fill="url(#ai-icon-gradient-home)"></circle>
            <circle cx="28" cy="18" r="1.8" fill="url(#ai-icon-gradient-home)"></circle>
            <path
              d="M20 28h8"
              stroke="url(#ai-icon-gradient-home)"
              stroke-width="2.6"
              stroke-linecap="round"
            ></path>
          </svg>
        </a>
        <div class="search-input">
          <el-input size="mini" placeholder="请输入商户名、地点">
            <i slot="prefix" class="el-input__icon el-icon-search"></i>
          </el-input>
        </div>
      </div>
      <div class="type-list">
        <div
          class="type-box"
          v-for="t in types"
          :key="t.id"
          @click="toShopList(t.id, t.name)"
        >
          <div class="type-view"><img :src="'/imgs/' + t.icon + '?v=20261024'" alt="" /></div>
          <div class="type-text">{{t.name}}</div>
        </div>
      </div>
      <div class="blog-list">
        <div class="blog-box" v-for="b in blogs" :key="b.id">
          <div class="blog-img" @click="toBlogDetail(b)">
            <img :src="b.img" alt="" />
          </div>
          <div class="blog-title">{{b.title}}</div>
          <div class="blog-foot">
            <div class="blog-user-icon">
              <img :src="b.icon || '/imgs/icons/default-icon.png'" alt="" />
            </div>
            <div class="blog-user-name">{{b.name}}</div>
            <div class="blog-liked" @click="addLike(b)">
              <svg
                t="1646634642977"
                class="icon"
                viewBox="0 0 1024 1024"
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                p-id="2187"
                width="14"
                height="14"
              >
                <path
                  d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z"
                  p-id="2188"
                  :fill="b.isLike ? '#ff6633' : '#82848a'"
                ></path>
              </svg>
              {{b.liked}}
            </div>
          </div>
        </div>
      </div>
      <foot-bar :active-btn="1"></foot-bar>
    </div>
    <script src="./js/vue.js"></script>
    <script src="./js/axios.min.js"></script>
    <!-- 引入组件库 -->
    <script src="./js/element.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/footer.js"></script>
    <script>
      const app = new Vue({
        el: "#app",
        data: {
          isReachBottom: false,
          types: [], // 类型列表
          blogs: [], // 播客列表
          current: 1, // blog的页码
        },
        created() {
          // 查询类型
          this.queryTypes();
          this.queryHotBlogsScroll();
        },
        methods: {
          queryTypes() {
            axios
              .get("/shop-type/list")
              .then(({ data }) => {
                this.types = data;
              })
              .catch((err) => {
                this.$message.error(err);
              });
          },
          queryHotBlogsScroll() {
            axios
              .get("/blog/hot?current=" + this.current)
              .then(({ data }) => {
                data.forEach((b) => (b.img = b.images.split(",")[0]));
                this.blogs = this.blogs.concat(data);
              })
              .catch((err) => {
                this.$message.error(err);
              });
          },
          addLike(b) {
            axios
              .put("/blog/like/" + b.id)
              .then(({ data }) => {
                this.queryBlogById(b);
              })
              .catch((err) => {
                this.$message.error(err);
              });
          },
          queryBlogById(b) {
            axios
              .get("/blog/" + b.id)
              .then(({ data }) => {
                b.liked = data.liked;
                b.isLike = data.isLike;
              })
              .catch(() => {
                this.$message.error;
                b.liked++;
              });
          },
          onScroll(e) {
            let scrollTop = e.target.scrollTop;
            let offsetHeight = e.target.offsetHeight;
            let scrollHeight = e.target.scrollHeight;
            if (
              scrollTop + offsetHeight > scrollHeight &&
              !this.isReachBottom
            ) {
              this.isReachBottom = true;

              // 再次查询下一页数据
              this.current++;
              this.queryHotBlogsScroll();
            } else {
              this.isReachBottom = false;
            }
          },
          toShopList(id, name) {
            location.href = "/shop-list.html?type=" + id + "&name=" + name;
          },
          toBlogDetail(b) {
            location.href = "/blog-detail.html?id=" + b.id;
          },
        },
      });
    </script>
  </body>
</html>
